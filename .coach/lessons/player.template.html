<title>Aulas de Padrões</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: um palco de aula (cena animada) com a legenda e a barra de transporte embaixo, e os capítulos da aula numa trilha abaixo. Mesmos tokens da Árvore de Padrões. */
:root {
  --bg: #F1F3F7;
  --surface: #FFFFFF;
  --sunk: #F6F7FA;
  --ink: #131826;
  --muted: #5B6476;
  --line: #D8DDE7;
  --accent: #2646C4;
  --accent-soft: #E4E9FB;
  --leaf: #0E7556;
  --leaf-soft: #DDF2EA;
  --warn: #9A5B00;
  --warn-soft: #FBF0DD;
  --bad: #B3261E;
  --bad-soft: #FBE4E2;
  --code-bg: #EDF0F5;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --gap: 6px;
  --cw: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1118; --surface: #151B26; --sunk: #111722; --ink: #E4E8F0; --muted: #8E98AA; --line: #273043;
    --accent: #8FA3FF; --accent-soft: #1E2747; --leaf: #52CFA0; --leaf-soft: #133029;
    --warn: #F0B45C; --warn-soft: #2E2414; --bad: #FF8A80; --bad-soft: #3A1A18; --code-bg: #0F141D; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1118; --surface: #151B26; --sunk: #111722; --ink: #E4E8F0; --muted: #8E98AA; --line: #273043;
  --accent: #8FA3FF; --accent-soft: #1E2747; --leaf: #52CFA0; --leaf-soft: #133029;
  --warn: #F0B45C; --warn-soft: #2E2414; --bad: #FF8A80; --bad-soft: #3A1A18; --code-bg: #0F141D; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
code, .mono { font-family: var(--f-mono); }

/* topo */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 20px; }
.top h1 { font-size: clamp(26px, 4vw, 38px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
.top p { color: var(--muted); max-width: 60ch; font-size: 14px; margin-top: 6px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 500; font-size: 14px; display: inline-flex; gap: 8px; align-items: baseline; }
.tab small { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.tab[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab[aria-current="true"] small { color: inherit; opacity: .7; }

/* palco */
.player { display: grid; gap: 10px; }
.stage-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.stage-head h2 { font-size: clamp(19px, 2.6vw, 24px); font-weight: 700; }
.stage-head .where { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stage { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-height: 440px; padding: clamp(16px, 3vw, 28px); display: grid; align-content: start; gap: 18px; overflow: hidden; }
.caption { min-height: 3.2em; font-size: 16px; line-height: 1.5; padding: 10px 14px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line); color: var(--ink); }
.caption[hidden] { display: none; }

/* transporte */
.transport { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.tbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; height: 40px; min-width: 40px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; }
.tbtn svg { width: 18px; height: 18px; fill: currentColor; }
.tbtn.play { background: var(--accent); border-color: var(--accent); color: var(--surface); min-width: 112px; font-weight: 600; }
.tbtn[aria-pressed="false"] { color: var(--muted); }
.tbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.bar { flex: 1 1 220px; display: flex; gap: 3px; min-width: 0; height: 40px; align-items: center; }
.seg { flex: 1; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; border: 0; padding: 0; }
.seg i { position: absolute; inset: 0 auto 0 0; width: var(--p, 0%); background: var(--accent); transition: width .3s; }
.seg:hover { background: var(--muted); }
.opts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select.tbtn { padding-right: 8px; }
.voicenote { font-size: 12.5px; color: var(--muted); }
@media (max-width: 640px) {
  .transport { position: sticky; bottom: 0; z-index: 5; background: var(--bg); padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
  .bar { order: 5; flex-basis: 100%; height: 14px; }
}

/* capítulos */
.chapters { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.chapters button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; display: grid; gap: 1px; font-size: 13.5px; }
.chapters button span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.chapters button[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chapters button.done span::after { content: " · vista"; color: var(--leaf); }

/* ---------- cena: cartão (problema, estrutura) ---------- */
.blocks { display: grid; gap: 16px; max-width: 720px; }
.blk { transition: opacity .45s, transform .45s, background-color .3s, border-color .3s; }
.blk.off { opacity: 0; transform: translateY(8px); pointer-events: none; }
.blk h3 { font-size: clamp(22px, 3.4vw, 30px); line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; }
.blk.ex { font-family: var(--f-mono); font-size: 14.5px; background: var(--code-bg); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; border: 1px solid transparent; }
.blk.callout { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.blk.callout b { font-family: var(--f-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--warn); }
.blk.kv { display: grid; grid-template-columns: minmax(120px, 170px) 1fr; gap: 12px; align-items: baseline; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); }
.blk.kv .k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.blk.kv .v { font-size: 17px; font-weight: 500; }
.blk.hi { border-color: var(--accent); background: var(--accent-soft); }
.blk.chips { display: grid; gap: 8px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 13.5px; color: var(--muted); background: var(--surface); transition: all .3s; }
.blk.chips.hi { background: transparent; border-color: transparent; }
.blk.chips.hi .chip.sel { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 500; }
@media (max-width: 560px) { .blk.kv { grid-template-columns: 1fr; gap: 2px; } }

/* ---------- cena: árvore ---------- */
.reading { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.reading b { font-family: var(--f-display); font-size: 17px; }
.trail { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 28px; }
.trail .crumb { font-size: 12.5px; border-radius: 6px; padding: 3px 8px; background: var(--accent-soft); color: var(--accent); max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trail .sep { color: var(--muted); font-size: 12px; }
.trail .start { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.node { display: grid; gap: 12px; animation: rise .45s both; }
.node h3 { font-size: clamp(19px, 2.8vw, 24px); line-height: 1.2; }
.optlist { display: grid; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; display: grid; gap: 1px; transition: opacity .35s, border-color .3s, background-color .3s, transform .3s; cursor: default; }
.opt .t { font-weight: 500; font-size: 14.5px; }
.opt .s { font-size: 12.5px; color: var(--muted); }
.optlist.dimmed .opt { opacity: .38; }
.optlist.dimmed .opt.pick { opacity: 1; }
.opt.pick { border-color: var(--accent); background: var(--accent-soft); transform: translateX(4px); }
.optlist.ask .opt { cursor: pointer; opacity: 1; }
.optlist.ask .opt:hover { border-color: var(--accent); }
.opt.right { border-color: var(--leaf); background: var(--leaf-soft); opacity: 1 !important; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); opacity: 1 !important; }
.crit { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 10px 14px; border-radius: 0 10px 10px 0; font-size: 14px; transition: opacity .4s; display: grid; gap: 2px; }
.crit b { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); }
.crit.off { opacity: 0; }
.leafcard { border: 1px solid var(--leaf); background: var(--leaf-soft); border-radius: 12px; padding: 16px 18px; display: grid; gap: 8px; animation: rise .5s both; }
.leafcard h3 { font-size: clamp(22px, 3.2vw, 28px); color: var(--leaf); }
.leafcard .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.both { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.both .col { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; align-content: start; animation: rise .45s both; }
.both .col:nth-child(2) { animation-delay: .15s; }
.both ol { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; }
.both li span { display: block; color: var(--muted); font-size: 12px; }
@media (max-width: 640px) { .both { grid-template-columns: 1fr; } }

/* ---------- cena: trace ---------- */
.trace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px 22px; align-items: start; }
.trace.nocode { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.trace .left { display: grid; gap: 14px; min-width: 0; }
.lines { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: center; overflow-x: auto; padding-bottom: 4px; }
.lab { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-align: right; }
.track { position: relative; display: grid; grid-template-columns: repeat(var(--n), var(--cw)); gap: var(--gap); }
.cell { height: var(--cw); max-height: 56px; border: 1px solid var(--line); border-radius: 8px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 18px; font-weight: 500; position: relative; background: var(--surface); transition: background-color .3s, border-color .3s, color .3s, opacity .3s; z-index: 1; }
.cell sub { position: absolute; top: 2px; left: 5px; font-size: 9.5px; color: var(--muted); font-weight: 400; }
.cell.in { background: var(--accent-soft); border-color: var(--accent); }
.cell.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.cell.good { background: var(--leaf-soft); border-color: var(--leaf); }
.cell.dim { opacity: .35; }
.vcell { height: 30px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 14px; border-radius: 6px; background: var(--sunk); transition: opacity .3s; }
.vcell.empty { opacity: 0; }
.vcell s { color: var(--bad); margin-right: 3px; text-decoration-thickness: 2px; }
.winbox { position: absolute; top: -5px; height: calc(var(--cw) + 10px); max-height: 66px; left: calc(var(--l) * (var(--cw) + var(--gap)) - 4px); width: calc(var(--len) * (var(--cw) + var(--gap)) - var(--gap) + 8px); border: 2px solid var(--accent); border-radius: 11px; transition: left .45s cubic-bezier(.3,.7,.3,1), width .45s cubic-bezier(.3,.7,.3,1), opacity .3s, border-color .3s; z-index: 2; pointer-events: none; }
.winbox.badw { border-color: var(--bad); }
.winbox.off { opacity: 0; }
.ptrs { position: relative; height: 22px; }
.ptr { position: absolute; top: 0; left: 0; width: var(--cw); text-align: center; font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--accent); transform: translateX(calc(var(--i) * (var(--cw) + var(--gap)))); transition: transform .45s cubic-bezier(.3,.7,.3,1), opacity .3s; }
.ptr::before { content: "▲"; display: block; font-size: 9px; line-height: 1; }
.ptr.off { opacity: 0; }
.spans { display: grid; gap: 4px; }
.span { position: relative; height: 16px; }
.span i { position: absolute; top: 4px; height: 8px; border-radius: 4px; background: var(--leaf); left: calc(var(--a) * (var(--cw) + var(--gap))); width: calc((var(--b) - var(--a) + 1) * (var(--cw) + var(--gap)) - var(--gap)); animation: grow .4s both; transform-origin: left; }
.span.miss i { background: var(--bad); }
.span em { position: absolute; top: 0; font-style: normal; font-family: var(--f-mono); font-size: 11px; color: var(--muted); left: calc((var(--b) + 1) * (var(--cw) + var(--gap)) + 4px); white-space: nowrap; }
.span.miss em { color: var(--bad); }
.side { display: grid; gap: 12px; min-width: 0; }
.map { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-family: var(--f-mono); font-size: 13.5px; }
.map .mt { padding: 6px 10px; font-size: 11.5px; color: var(--muted); background: var(--sunk); border-bottom: 1px solid var(--line); }
.map .row { display: grid; grid-template-columns: 1fr 1fr; padding: 5px 10px; border-top: 1px solid var(--line); transition: background-color .3s; }
.map .row:first-of-type { border-top: 0; }
.map .row.hi { background: var(--accent-soft); }
.map .row .k { color: var(--muted); }
.map .empty { padding: 6px 10px; color: var(--muted); font-size: 12px; }
.vars { display: flex; flex-wrap: wrap; gap: 6px; }
.var { font-family: var(--f-mono); font-size: 13.5px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; }
.var b { color: var(--accent); font-weight: 600; }
.var.bump { animation: bump .5s; }
.codebox { background: var(--code-bg); border-radius: 10px; overflow-x: auto; min-width: 0; }
.code { margin: 0; padding: 10px 0; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.6; }
.code .ln { display: block; padding: 0 14px 0 30px; position: relative; white-space: pre; transition: background-color .3s; }
.code .ln::before { content: attr(data-n); position: absolute; left: 8px; color: var(--muted); font-size: 10.5px; opacity: .7; }
.code .ln.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.code .ln.diff { background: var(--warn-soft); }
.code .ln.diff::before { color: var(--warn); opacity: 1; font-weight: 600; }
.code .ln.diff.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--warn); }
.codenote { font-size: 12px; color: var(--warn); padding: 8px 14px 0; }
.codenote[hidden] { display: none; }
.code .kw { color: var(--accent); }
.code .ty { color: var(--leaf); }
.code .cm { color: var(--muted); font-style: italic; }
.code .nu { color: var(--warn); }
@media (max-width: 760px) { .trace, .trace.nocode { grid-template-columns: minmax(0, 1fr); } }

/* ---------- cena: fronteiras ---------- */
.bounds { display: grid; gap: 10px; }
.bcard { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; transition: opacity .4s, transform .4s, border-color .3s, background-color .3s; }
.bcard.off { display: none; }
.bcard.hi { border-color: var(--accent); background: var(--accent-soft); }
.bcard.lo { opacity: .6; }
.bcard header { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.bcard h3 { font-size: 17px; }
.badge { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; }
.badge.fail { background: var(--bad-soft); color: var(--bad); }
.badge.alt { background: var(--leaf-soft); color: var(--leaf); }
.badge.see { background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.bcard p { font-size: 14px; }
.bcard .flip { font-size: 13px; color: var(--muted); }
.bcard .flip b { color: var(--ink); font-weight: 600; }
.bcard .cxt { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.trapcard { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 10px 14px; border-radius: 0 10px 10px 0; font-size: 14px; animation: rise .4s both; }
.trapcard b { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); display: block; }
.cxbox { display: grid; gap: 6px; padding-top: 6px; }

/* ---------- cena: recap ---------- */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.rcard { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px; text-align: left; display: grid; gap: 8px; align-content: start; min-height: 150px; transition: border-color .3s, background-color .3s; }
.rcard .q { font-weight: 500; font-size: 15px; }
.rcard .hint { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.rcard .a { display: none; }
.rcard.flipped { border-color: var(--leaf); background: var(--leaf-soft); }
.rcard.flipped .a { display: grid; gap: 4px; }
.rcard.flipped .hint { display: none; }
.rcard .a b { font-family: var(--f-display); font-size: 18px; color: var(--leaf); }
.rcard .a span { font-size: 13px; }
.take { border-radius: 12px; padding: 16px 18px; background: var(--ink); color: var(--bg); font-family: var(--f-display); font-size: clamp(17px, 2.4vw, 21px); line-height: 1.35; animation: rise .45s both; }
.nextl { justify-self: start; border: 1px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; }
@media (max-width: 760px) { .cards { grid-template-columns: 1fr; } .rcard { min-height: 0; } }

/* ---------- quiz ---------- */
.quiz { border: 1px dashed var(--accent); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; animation: rise .35s both; background: var(--surface); }
.quiz .qh { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.quiz .qopts { display: grid; gap: 6px; }
.quiz .qopts button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; font-size: 14.5px; }
.quiz .qopts button:hover { border-color: var(--accent); }
.quiz .qopts button.right { border-color: var(--leaf); background: var(--leaf-soft); }
.quiz .qopts button.wrong { border-color: var(--bad); background: var(--bad-soft); }
.quiz .qx { font-size: 14px; }
.askhint { font-family: var(--f-mono); font-size: 11.5px; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
@keyframes bump { 40% { transform: scale(1.12); border-color: var(--accent); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Árvore de Padrões · aulas</div>
      <h1 id="ltitle">Aulas de Padrões</h1>
      <p id="lkicker"></p>
    </div>
    <nav class="tabs" id="tabs" aria-label="Aulas"></nav>
  </header>

  <main class="player">
    <div class="stage-head">
      <h2 id="stitle"></h2>
      <span class="where" id="where"></span>
    </div>
    <section class="stage" id="stage" aria-live="off"></section>
    <p class="caption" id="caption" aria-live="polite"></p>
    <div class="transport">
      <button class="tbtn" id="prev" aria-label="Passo anterior" title="Passo anterior (←)"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="tbtn play" id="play" aria-label="Tocar"><svg viewBox="0 0 24 24" id="playicon"><path d="M8 5v14l11-7z"/></svg><span id="playlabel">Tocar</span></button>
      <button class="tbtn" id="next" aria-label="Próximo passo" title="Próximo passo (→)"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <div class="bar" id="bar"></div>
      <div class="opts">
        <select class="tbtn" id="speed" aria-label="Velocidade">
          <option value="0.75">0,75×</option><option value="0.9">0,9×</option><option value="1" selected>1×</option><option value="1.15">1,15×</option><option value="1.3">1,3×</option><option value="1.5">1,5×</option>
        </select>
        <button class="tbtn" id="voice" aria-pressed="true" title="Narração">Voz</button>
        <button class="tbtn" id="cc" aria-pressed="false" title="Legenda">Legenda</button>
      </div>
    </div>
    <p class="voicenote" id="voicenote"></p>
    <ol class="chapters" id="chapters"></ol>
  </main>
</div>

<script>
const DATA = /*__DATA__*/null;
const T = DATA.tree, LESSONS = DATA.lessons;
const ROOTS = { root: "Pela forma do input", nroot: "Pelo que a solução precisa fazer" };
const VERD = { fail: "não serve aqui", alt: "também funciona", see: "parente próximo" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = v => typeof v === "number" && v < 0 ? "−" + Math.abs(v) : String(v);
const store = {
  get(k, d) { try { const v = localStorage.getItem("aulas:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("aulas:" + k, JSON.stringify(v)); } catch {} },
};

/* ---------------- estado do player ---------------- */
const prefs = Object.assign({ speed: 1, voice: true, cc: null }, store.get("prefs", {}));
const seen = store.get("seen", {});           // {lessonId: [sceneIdx...]}
const answers = new Map();                    // "l/s/t" -> chosen index
let LI = 0, SI = 0, TI = 0, playing = false, token = 0, view = null, viewKey = "";

const lesson = () => LESSONS[LI];
const scene = () => lesson().scenes[SI];
const step = () => scene().steps[TI];
const qkey = () => `${LI}/${SI}/${TI}`;

function cumulative(sc, upto) {
  const s = {};
  for (let i = 0; i <= upto; i++) Object.assign(s, sc.steps[i].show || {});
  return s;
}

/* ---------------- voz ---------------- */
const speech = { ok: "speechSynthesis" in window, voice: null };
function pickVoice() {
  if (!speech.ok) return;
  const vs = speechSynthesis.getVoices();
  speech.voice = vs.find(v => /^pt[-_]BR/i.test(v.lang) && /natural|online|neural|google/i.test(v.name))
    || vs.find(v => /^pt[-_]BR/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null;
  voiceNote();
}
/* narração gravada (audio/manifest.json, gerado por build_audio.py): funciona em qualquer app */
const REC = DATA.audio && Object.keys(DATA.audio.files || {}).length ? DATA.audio : null;
const clip = text => REC && REC.files[text];
const player = new Audio();
player.preload = "auto";
try { player.preservesPitch = true; } catch {}
const hasVoice = () => !!(REC || (speech.ok && speech.voice));
const canSpeak = () => prefs.voice && hasVoice();
let blocked = false;
function voiceNote() {
  const n = $("#voicenote");
  if (blocked) n.textContent = "O som foi bloqueado pelo aparelho. Toque em Tocar para liberar.";
  else if (REC && prefs.voice) n.textContent = `Narração gravada (${REC.voice}). Espaço toca e pausa; as setas andam um passo.`;
  else if (REC) n.textContent = "Narração desligada: a aula avança pelo tempo de leitura.";
  else if (!speech.ok || !speech.voice) n.textContent = "Este navegador não tem voz em português: a aula avança pelo tempo de leitura, com a legenda ligada.";
  else if (!prefs.voice) n.textContent = "Narração desligada: a aula avança pelo tempo de leitura.";
  else n.textContent = `Narração com a voz do seu aparelho: ${speech.voice.name}. Espaço toca e pausa; as setas andam um passo.`;
  syncCC();
}
const readMs = text => (text.split(/\s+/).length / (165 * prefs.speed)) * 60000 + 900;
function stopVoice() { token++; if (speech.ok) speechSynthesis.cancel(); player.pause(); }
function playClip(file, text, my, done) {
  let fired = false;
  const finish = () => { if (fired || my !== token) return; fired = true; setTimeout(() => my === token && done(), 250); };
  player.onended = finish;
  player.onerror = () => { if (my !== token || fired) return; fired = true; setTimeout(() => my === token && done(), readMs(text)); };
  player.src = REC.base + file;
  player.playbackRate = prefs.speed;
  const pr = player.play();
  if (pr) pr.then(() => { if (blocked) { blocked = false; voiceNote(); } }).catch(err => {
    if (my !== token) return;
    if (err && err.name === "NotAllowedError") { blocked = true; voiceNote(); setPlaying(false); }
    else player.onerror();
  });
}
function say(text, done) {
  const my = ++token;
  if (speech.ok) speechSynthesis.cancel();
  player.pause();
  if (!text) { setTimeout(() => my === token && done(), 300); return; }
  if (prefs.voice && clip(text)) { playClip(clip(text), text, my, done); return; }
  if (!(prefs.voice && speech.ok && speech.voice)) { setTimeout(() => my === token && done(), readMs(text)); return; }
  const parts = text.match(/[^.!?:]+[.!?:]*\s*/g) || [text];
  let i = 0;
  const next = () => {
    if (my !== token) return;
    if (i >= parts.length) { done(); return; }
    const part = parts[i++].trim();
    if (!part) { next(); return; }
    const u = new SpeechSynthesisUtterance(part);
    u.voice = speech.voice; u.lang = speech.voice.lang; u.rate = prefs.speed;
    let fired = false;
    const go = () => { if (fired) return; fired = true; clearTimeout(dog); setTimeout(next, 120); };
    const dog = setTimeout(go, readMs(part) * 1.8 + 2500);   // alguns navegadores perdem o onend
    u.onend = go; u.onerror = go;
    speechSynthesis.speak(u);
  };
  next();
}

/* ---------------- views ---------------- */
function chipsFrom(path) { let x = T; for (const k of path) x = x?.[k]; return x || []; }

const VIEWS = {
  card: {
    mount(sc, el) {
      el.innerHTML = `<div class="blocks">${sc.blocks.map(b => {
        const a = `data-id="${b.id}"`;
        if (b.type === "eyebrow") return `<div class="blk eyebrow" ${a}>${esc(b.text)}</div>`;
        if (b.type === "h") return `<div class="blk" ${a}><h3>${esc(b.text)}</h3></div>`;
        if (b.type === "ex") return `<div class="blk ex" ${a}>${esc(b.text)}</div>`;
        if (b.type === "callout") return `<div class="blk callout" ${a}><b>${esc(b.label)}</b><span>${esc(b.text)}</span></div>`;
        if (b.type === "kv") return `<div class="blk kv" ${a}><span class="k">${esc(b.k)}</span><span class="v">${esc(b.v)}</span></div>`;
        if (b.type === "chips") return `<div class="blk chips" ${a}><span class="eyebrow">${esc(b.label)}</span><div class="chiprow">${chipsFrom(b.from).map((c, i) => `<span class="chip${(b.hi || []).includes(i) ? " sel" : ""}">${esc(c)}</span>`).join("")}</div></div>`;
        return "";
      }).join("")}</div>`;
      return {
        update(s) {
          el.querySelectorAll(".blk").forEach(b => {
            b.classList.toggle("off", !(s.on || []).includes(b.dataset.id));
            b.classList.toggle("hi", (s.hi || []).includes(b.dataset.id));
          });
        },
      };
    },
  },

  tree: {
    mount(sc, el) {
      el.innerHTML = `<div class="reading"><span class="eyebrow">${sc.reading === "root" ? "Leitura 1" : "Leitura 2"}</span><b>${esc(ROOTS[sc.reading])}</b></div>
        <div class="trail" id="trail"></div><div id="tbody"></div>`;
      let shown = null;
      const trail = el.querySelector("#trail"), body = el.querySelector("#tbody");
      return {
        update(s) {
          const tr = s.trail || [];
          trail.innerHTML = `<span class="start">${s.both ? "" : "raiz"}</span>` + (s.both ? "" : tr.map(([n, i]) => `<span class="sep">›</span><span class="crumb" title="${esc(T.N[n].opts[i].t)}">${esc(T.N[n].opts[i].t)}</span>`).join(""));
          const key = s.both ? "both" : s.node ? "n:" + s.node : s.leaf ? "l:" + s.leaf : "";
          if (key !== shown) {
            shown = key;
            if (s.both) {
              const col = (t, i) => `<div class="col"><span class="eyebrow">Leitura ${i + 1} · ${esc(ROOTS[t[0][0]])}</span><ol>${t.map(([n, k]) => `<li><span>${esc(T.N[n].q)}</span>${esc(T.N[n].opts[k].t)}</li>`).join("")}</ol></div>`;
              body.innerHTML = `<div class="both">${s.both.map(col).join("")}</div>${leafCard(s.leaf, "As duas leituras chegam aqui")}`;
            } else if (s.node) {
              const N = T.N[s.node];
              body.innerHTML = `<div class="node"><h3>${esc(N.q)}</h3><div class="optlist">${N.opts.map((o, i) => `<button type="button" class="opt" data-i="${i}" tabindex="-1"><span class="t">${esc(o.t)}</span>${o.s ? `<span class="s">${esc(o.s)}</span>` : ""}</button>`).join("")}</div>
                <div class="crit off"><b>Critério deste nó</b><span>${esc(T.D[s.node] || "")}</span></div></div>`;
            } else if (s.leaf) body.innerHTML = leafCard(s.leaf, "Folha");
            else body.innerHTML = "";
          }
          const list = body.querySelector(".optlist");
          if (list) {
            body.querySelector(".askhint")?.remove();
            list.classList.remove("ask");
            list.querySelectorAll(".opt").forEach(o => { o.tabIndex = -1; o.onclick = null; });
            list.classList.toggle("dimmed", s.hi != null);
            list.querySelectorAll(".opt").forEach(o => o.classList.toggle("pick", +o.dataset.i === s.hi));
          }
          const c = body.querySelector(".crit");
          if (c) c.classList.toggle("off", !s.showD);
        },
        ask(q, onPick, chosen) {
          const list = body.querySelector(".optlist");
          if (!list) return;
          list.classList.add("ask"); list.classList.remove("dimmed");
          list.insertAdjacentHTML("beforebegin", `<div class="askhint">Sua vez: toque na opção</div>`);
          const opts = [...list.querySelectorAll(".opt")];
          const mark = i => { opts.forEach(o => o.tabIndex = -1); list.classList.remove("ask"); body.querySelector(".askhint")?.remove();
            opts[q.correct].classList.add("right"); if (i !== q.correct) opts[i].classList.add("wrong"); };
          if (chosen != null) { mark(chosen); return; }
          opts.forEach((o, i) => { o.tabIndex = 0; o.onclick = () => { if (!list.classList.contains("ask")) return; mark(i); onPick(i); }; });
        },
      };
    },
  },

  trace: {
    mount(sc, el) {
      const L = lesson(), n = sc.cells.length;
      const first = sc.steps.find(x => x.show && x.show.rows)?.show.rows || [];
      const hasCode = !!sc.code;
      el.innerHTML = `<div class="trace${hasCode ? "" : " nocode"}">
        <div class="left">
          <div class="lines" style="--n:${n}">
            <span class="lab">${typeof sc.cells[0] === "string" ? "s" : "nums"}</span>
            <div class="track cells">${sc.cells.map((v, i) => `<div class="cell" data-i="${i}"><sub>${i}</sub>${esc(num(v))}</div>`).join("")}<div class="winbox off"></div></div>
            <span class="lab"></span><div class="ptrs"></div>
            ${first.map(r => `<span class="lab">${esc(r.label)}</span><div class="track row" data-row="${esc(r.label)}">${sc.cells.map(() => `<div class="vcell empty"></div>`).join("")}</div>`).join("")}
            <span class="lab"></span><div class="spans"></div>
          </div>
          ${hasCode ? "" : `<div class="side"><div class="map"></div><div class="vars"></div></div>`}
        </div>
        ${hasCode ? `<div class="side"><div class="codebox"><p class="codenote" hidden>Linhas em âmbar: o que muda em relação ao template do card</p><pre class="code"></pre></div><div class="map"></div><div class="vars"></div></div>` : ""}
      </div>`;
      const lines = el.querySelector(".lines");
      const fit = () => {
        const w = lines.clientWidth - 48;
        const cw = Math.max(34, Math.min(58, Math.floor((w - 6 * (n - 1)) / n)));
        lines.style.setProperty("--cw", cw + "px");
      };
      fit(); new ResizeObserver(fit).observe(el);
      let codeWhich = null, lastVars = {};
      const codeText = which => which === "alt" ? L.alt.code : T.P[L.leaf].tpl;
      return {
        update(s) {
          const st = s.strip || {};
          const [l, r] = st.range || [0, -1];
          el.querySelectorAll(".cell").forEach(c => {
            const i = +c.dataset.i;
            c.classList.toggle("in", st.range != null && i >= l && i <= r);
            c.classList.toggle("bad", (st.bad || []).includes(i));
            c.classList.toggle("good", (st.good || []).includes(i));
            c.classList.toggle("dim", st.range != null && r >= 0 && i > r);
          });
          const wb = el.querySelector(".winbox");
          wb.classList.toggle("off", !(st.range && r >= l));
          wb.classList.toggle("badw", (st.bad || []).length > 0);
          if (st.range && r >= l) { wb.style.setProperty("--l", l); wb.style.setProperty("--len", r - l + 1); }
          const pt = el.querySelector(".ptrs"), names = Object.keys(st.ptr || {});
          pt.style.height = Math.max(1, names.length) * 22 + "px";
          names.forEach((nm, k) => {
            let p = pt.querySelector(`[data-p="${nm}"]`);
            if (!p) { p = document.createElement("div"); p.className = "ptr"; p.dataset.p = nm; p.textContent = nm; pt.appendChild(p); }
            p.style.top = k * 22 + "px"; p.style.setProperty("--i", Math.max(0, st.ptr[nm]));
            p.classList.toggle("off", st.ptr[nm] < 0);
          });
          pt.querySelectorAll(".ptr").forEach(p => { if (!names.includes(p.dataset.p)) p.classList.add("off"); });
          (s.rows || []).forEach(rw => {
            const tr = el.querySelector(`[data-row="${rw.label}"]`);
            if (!tr) return;
            tr.querySelectorAll(".vcell").forEach((c, i) => {
              const has = i < rw.vals.length;
              c.classList.toggle("empty", !has);
              c.innerHTML = has ? (rw.raw && rw.raw[0] === i ? `<s>${esc(num(rw.raw[1]))}</s>${esc(num(rw.vals[i]))}` : esc(num(rw.vals[i]))) : "";
            });
          });
          el.querySelector(".spans").innerHTML = (st.spans || []).map(([a, b]) => `<div class="span" style="--a:${a};--b:${b}"><i></i><em>divisível</em></div>`).join("");
          const m = s.map;
          if (m) el.querySelector(".map").innerHTML = `<div class="mt">${esc(m.title)}</div>` + (m.entries.length ? m.entries.map(([k, v]) =>
            `<div class="row${k === m.hi ? " hi" : ""}"><span class="k">${typeof k === "string" ? `'${esc(k)}'` : esc(num(k))}</span><span>${esc(v)}</span></div>`).join("") : `<div class="empty">vazio</div>`);
          const vs = el.querySelector(".vars");
          vs.innerHTML = (s.vars || []).map(([k, v]) => `<span class="var${lastVars[k] !== undefined && lastVars[k] !== v ? " bump" : ""}">${esc(k)} = <b>${esc(num(v))}</b></span>`).join("");
          lastVars = Object.fromEntries(s.vars || []);
          if (hasCode) {
            const which = (s.code && s.code.which) || "tpl";
            const box = el.querySelector(".code");
            if (which !== codeWhich) {
              codeWhich = which;
              const diff = which === "alt" ? L.alt.diff : [];
              el.querySelector(".codenote").hidden = which !== "alt";
              box.innerHTML = codeText(which).split("\n").map((ln, i) => `<span class="ln${diff.includes(i) ? " diff" : ""}" data-n="${i + 1}">${hl(ln) || " "}</span>`).join("");
            }
            const on = (s.code && s.code.hl) || [];
            box.querySelectorAll(".ln").forEach((ln, i) => ln.classList.toggle("on", on.includes(i)));
          }
        },
      };
    },
  },

  bounds: {
    mount(sc, el) {
      const list = T.F[sc.leaf] || [];
      const id = b => b.k || b.name;
      el.innerHTML = `<div class="bounds">${list.map(b => `<article class="bcard off" data-id="${esc(id(b))}">
          <header><span class="badge ${b.v}">${VERD[b.v]}</span><h3>${esc(b.k ? T.P[b.k].name : b.name)}</h3></header>
          <p>${esc(b.why)}</p>
          ${b.flip ? `<p class="flip"><b>Troque quando:</b> ${esc(b.flip)}</p>` : ""}
          ${b.cx ? `<p class="cxt">${esc(b.cx)}</p>` : ""}
          ${sc.cx && sc.cx.for === id(b) ? `<div class="cxbox"></div>` : ""}
        </article>`).join("")}<div class="trapslot"></div></div>`;
      return {
        update(s) {
          el.querySelectorAll(".bcard").forEach(c => {
            c.classList.toggle("off", !(s.on || []).includes(c.dataset.id));
            c.classList.toggle("hi", s.hi === c.dataset.id);
            c.classList.toggle("lo", s.hi != null && s.hi !== c.dataset.id);
          });
          const slot = el.querySelector(".trapslot");
          slot.innerHTML = s.trap ? `<div class="trapcard"><b>Armadilha do card</b>${esc(T.P[sc.leaf].trap)}</div>` : "";
          const box = el.querySelector(".cxbox");
          if (box) {
            const cx = sc.cx, st = s.cx || 0;
            if (!st) { box.innerHTML = ""; return; }
            const found = sp => cx.win.some(w => w[0] === sp[0] && w[1] === sp[1]);
            box.innerHTML = `<div class="lines" style="--n:${cx.cells.length};--cw:44px">
              <span class="lab">nums</span><div class="track cells">${cx.cells.map((v, i) => `<div class="cell"><sub>${i}</sub>${esc(num(v))}</div>`).join("")}</div>
              <span class="lab"></span><div class="spans">${cx.ok.map(sp => `<div class="span${st > 1 && !found(sp) ? " miss" : ""}" style="--a:${sp[0]};--b:${sp[1]}"><i></i><em>${st > 1 ? (found(sp) ? "janela conta" : "janela perde") : "soma 1"}</em></div>`).join("")}</div></div>`;
          }
        },
      };
    },
  },

  recap: {
    mount(sc, el) {
      const L = lesson(), other = LESSONS.findIndex(x => x.id === L.contrast);
      el.innerHTML = `<div class="cards">${sc.cards.map((c, i) => `<button type="button" class="rcard" data-i="${i}" aria-expanded="false">
          <span class="eyebrow">Cartão ${i + 1}</span><span class="q">${esc(c.q)}</span><span class="hint">Diga o padrão, depois toque para virar</span>
          <span class="a"><b>${esc(c.a)}</b><span>${esc(c.why)}</span></span></button>`).join("")}</div>
        <div class="takeslot"></div>
        ${other >= 0 ? `<button type="button" class="nextl" data-go="${other}">Próxima aula: ${esc(LESSONS[other].title)} →</button>` : ""}`;
      el.querySelectorAll(".rcard").forEach(b => b.onclick = () => { const f = b.classList.toggle("flipped"); b.setAttribute("aria-expanded", f); });
      const nx = el.querySelector(".nextl");
      if (nx) nx.onclick = () => openLesson(+nx.dataset.go, 0, true);
      return {
        update(s) {
          el.querySelector(".takeslot").innerHTML = s.take ? `<div class="take">${esc(sc.take)}</div>` : "";
        },
      };
    },
  },
};

function leafCard(k, label) {
  const p = T.P[k];
  return `<div class="leafcard"><span class="eyebrow">${esc(label)}</span><h3>${esc(p.name)}</h3><p>${esc(p.idea)}</p>
    <div class="meta"><span>${esc(p.ds)}</span><span>${esc(p.op)}</span><span>${esc(p.cx)}</span></div></div>`;
}

const KW = /\b(var|int|new|for|foreach|while|if|return|in|else)\b/g, TY = /\b(Dictionary|Math|char|LinkedList|List)\b/g;
function hl(line) {
  let code = line, cm = "";
  const c = line.indexOf("//");
  if (c >= 0) { code = line.slice(0, c); cm = line.slice(c); }
  code = esc(code).replace(KW, '<span class="kw">$1</span>').replace(TY, '<span class="ty">$1</span>').replace(/\b(\d+)\b(?![^<]*>)/g, '<span class="nu">$1</span>');
  return code + (cm ? `<span class="cm">${esc(cm)}</span>` : "");
}

/* ---------------- quiz genérico ---------------- */
function mountQuiz(q, chosen, onPick) {
  const stage = $("#stage");
  stage.querySelector(".quiz")?.remove();
  stage.insertAdjacentHTML("beforeend", `<div class="quiz"><span class="qh">Pause e preveja</span><div class="qopts">${q.opts.map((o, i) => `<button type="button" data-i="${i}">${esc(o)}</button>`).join("")}</div><p class="qx"></p></div>`);
  const box = stage.querySelector(".quiz"), bs = [...box.querySelectorAll("button")];
  const mark = i => { bs.forEach(b => b.disabled = true); bs[q.correct].classList.add("right"); if (i !== q.correct) bs[i].classList.add("wrong");
    box.querySelector(".qx").textContent = q.explain; };
  if (chosen != null) { mark(chosen); return; }
  bs.forEach((b, i) => b.onclick = () => { mark(i); onPick(i); });
}

/* ---------------- render e fluxo ---------------- */
function render() {
  const sc = scene(), L = lesson();
  const key = `${LI}/${SI}`;
  const stage = $("#stage");
  if (key !== viewKey) { viewKey = key; view = VIEWS[sc.kind].mount(sc, stage); }
  stage.querySelector(".quiz")?.remove();
  view.update(cumulative(sc, TI));
  const s = step();
  $("#stitle").textContent = sc.title;
  $("#where").textContent = `cena ${SI + 1}/${L.scenes.length} · passo ${TI + 1}/${sc.steps.length}`;
  $("#caption").textContent = s.say || "";
  if (s.quiz) {
    const chosen = answers.get(qkey());
    const onPick = i => { answers.set(qkey(), i); afterAnswer(s.quiz); };
    if (s.quiz.node && view.ask) view.ask(s.quiz, onPick, chosen);
    else mountQuiz(s.quiz, chosen, onPick);
    if (chosen != null && s.quiz.node) $("#caption").textContent = s.quiz.explain;
  }
  drawBar(); drawChapters();
  store.set("pos", { l: L.id, s: SI });
  (seen[L.id] = seen[L.id] || []);
  if (!seen[L.id].includes(SI)) { seen[L.id].push(SI); store.set("seen", seen); }
}

function afterAnswer(q) {
  $("#caption").textContent = q.explain;
  const my = token + 1;
  say(q.explain, () => { if (playing && my === token) advance(); });
}

function runStep() {
  render();
  if (!playing) { stopVoice(); return; }
  const s = step();
  say(s.say, () => {
    if (s.quiz && !answers.has(qkey())) return;   // espera a resposta
    advance();
  });
}

function advance() {
  const sc = scene();
  if (TI + 1 < sc.steps.length) { TI++; runStep(); return; }
  if (SI + 1 < lesson().scenes.length) {
    const my = ++token;
    setTimeout(() => { if (my !== token || !playing) return; SI++; TI = 0; runStep(); }, 700);
    return;
  }
  setPlaying(false);
}

function go(si, ti) { stopVoice(); SI = si; TI = ti; runStep(); }
function stepBy(d) {
  const L = lesson();
  if (d > 0) {
    if (TI + 1 < scene().steps.length) go(SI, TI + 1);
    else if (SI + 1 < L.scenes.length) go(SI + 1, 0);
  } else {
    if (TI > 0) go(SI, TI - 1);
    else if (SI > 0) go(SI - 1, L.scenes[SI - 1].steps.length - 1);
  }
}

function setPlaying(p) {
  playing = p;
  $("#playlabel").textContent = p ? "Pausar" : "Tocar";
  $("#play").setAttribute("aria-label", p ? "Pausar" : "Tocar");
  $("#playicon").innerHTML = p ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  if (!p) stopVoice();
}

function openLesson(li, si, autoplay) {
  stopVoice();
  LI = li; SI = si; TI = 0; viewKey = "";
  const L = lesson();
  document.title = `${L.title} · Aulas de Padrões`;
  $("#ltitle").textContent = L.title;
  $("#lkicker").textContent = L.kicker;
  try { if (location.hash !== "#" + L.id) history.replaceState(null, "", "#" + L.id); } catch {}
  drawTabs();
  setPlaying(!!autoplay);
  runStep();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function drawTabs() {
  $("#tabs").innerHTML = LESSONS.map((L, i) => `<button type="button" class="tab" aria-current="${i === LI}" data-l="${i}">${esc(L.title)}<small>${L.scenes.length} cenas</small></button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => openLesson(+b.dataset.l, 0, false));
}
function drawBar() {
  const L = lesson();
  const bar = $("#bar");
  if (bar.childElementCount !== L.scenes.length) {
    bar.innerHTML = L.scenes.map((sc, i) => `<button type="button" class="seg" data-s="${i}" aria-label="Cena ${i + 1}: ${esc(sc.title)}" title="${esc(sc.title)}"><i></i></button>`).join("");
    bar.querySelectorAll(".seg").forEach(b => b.onclick = () => go(+b.dataset.s, 0));
  }
  bar.querySelectorAll(".seg").forEach((b, i) => b.firstChild.style.setProperty("--p", i < SI ? "100%" : i > SI ? "0%" : ((TI + 1) / L.scenes[i].steps.length * 100) + "%"));
}
function drawChapters() {
  const L = lesson(), done = seen[L.id] || [];
  $("#chapters").innerHTML = L.scenes.map((sc, i) => `<li><button type="button" data-s="${i}" aria-current="${i === SI}" class="${done.includes(i) && i !== SI ? "done" : ""}"><span>${i + 1} · ${sc.steps.length} passos</span>${esc(sc.title)}</button></li>`).join("");
  $("#chapters").querySelectorAll("button").forEach(b => b.onclick = () => go(+b.dataset.s, 0));
}
function syncCC() {
  const on = prefs.cc == null ? !canSpeak() : prefs.cc;
  $("#caption").hidden = !on;
  $("#cc").setAttribute("aria-pressed", on);
  $("#voice").setAttribute("aria-pressed", !!(prefs.voice && hasVoice()));
  $("#voice").disabled = !hasVoice();
}

/* ---------------- controles ---------------- */
$("#play").onclick = () => {
  if (playing) { setPlaying(false); return; }
  const L = lesson();
  if (SI === L.scenes.length - 1 && TI === scene().steps.length - 1) { SI = 0; TI = 0; }
  setPlaying(true); runStep();
};
$("#prev").onclick = () => stepBy(-1);
$("#next").onclick = () => stepBy(1);
$("#speed").value = String(prefs.speed);
$("#speed").onchange = e => { prefs.speed = +e.target.value; store.set("prefs", prefs); player.playbackRate = prefs.speed; if (playing && !REC) runStep(); };
$("#voice").onclick = () => { prefs.voice = !prefs.voice; store.set("prefs", prefs); voiceNote(); if (playing) runStep(); };
$("#cc").onclick = () => { const on = $("#cc").getAttribute("aria-pressed") !== "true"; prefs.cc = on; store.set("prefs", prefs); syncCC(); };
document.addEventListener("keydown", e => {
  if (e.target.closest("select")) return;
  if (e.key === " " && !e.target.closest("button")) { e.preventDefault(); $("#play").click(); }
  else if (e.key === "ArrowRight") stepBy(1);
  else if (e.key === "ArrowLeft") stepBy(-1);
});
window.addEventListener("hashchange", () => {
  const i = LESSONS.findIndex(L => "#" + L.id === location.hash);
  if (i >= 0 && i !== LI) openLesson(i, 0, false);
});

/* início: aula do hash, ou a última aberta */
(function start() {
  const pos = store.get("pos", null);
  let li = LESSONS.findIndex(L => "#" + L.id === location.hash), si = 0;
  if (li < 0 && pos) { li = LESSONS.findIndex(L => L.id === pos.l); si = pos.s || 0; }
  if (li < 0) li = 0;
  if (si >= LESSONS[li].scenes.length) si = 0;
  if (speech.ok) { speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); } else voiceNote();
  openLesson(li, si, false);
})();
</script>
